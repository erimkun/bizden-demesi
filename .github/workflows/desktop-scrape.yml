name: Desktop Ticket Scraper

on:
  schedule:
    # Günde 1 kere gece 3 te çalışır
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  desktop-scrape:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./desktop-scraper
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./desktop-scraper
        run: npx playwright install chromium

      - name: Run Desktop Scraper
        working-directory: ./desktop-scraper
        run: npm run scrape
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
